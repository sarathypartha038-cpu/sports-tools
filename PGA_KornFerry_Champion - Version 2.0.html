<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Golf PGA Champion and Korn Ferry Score Comparator</title>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
body{background:#e5e5e5;margin:0;padding:20px;font-family:Arial;text-align:center;}
h1{color:#004a99;}
.wrap{width:95%;margin:auto;background:#fff;padding:20px;border-radius:10px;
box-shadow:0 6px 24px rgba(0,0,0,.25);}
.flex{display:flex;gap:20px;}
textarea{
    width:50%;height:320px;padding:10px;background:#111;color:#0f0;
    font-family:monospace;border-radius:6px;border:1px solid #555;
}
button{
    padding:10px 20px;font-size:14px;color:#fff;background:#0074e8;
    border:none;border-radius:6px;cursor:pointer;margin:5px;
}
button:hover{background:#005bbd;}
.clearBtn{background:#c00!important;}
.clearBothBtn{background:#c97300!important;}

table{width:100%;border-collapse:collapse;margin-top:25px;font-size:13px;}
th{background:#005bbd;color:#fff;padding:6px;border:1px solid #333;position:sticky;top:0;}
td{padding:6px;border:1px solid #ccc;text-align:center;}

.ok{background:#d6ffe0;color:#006600;}
.mis{background:#ffe5e5;color:#990000;font-weight:bold;}
.upd{background:#fff7b3;color:#000;}

.playerCell{text-align:left;font-weight:bold;}
.subName{font-size:11px;color:#555;}

#loginBox{
    width:350px;margin:100px auto;padding:20px;background:#fff;
    border-radius:10px;box-shadow:0 0 20px rgba(0,0,0,.2);
}
#logoutBtn{
    position:absolute;right:30px;top:20px;
    background:#c00;color:#fff;padding:8px 22px;border-radius:6px;
    border:none;cursor:pointer;font-weight:bold;
}
</style>
</head>

<body>

<button id="logoutBtn" style="display:none;" onclick="logout()">LOGOUT</button>

<div id="loginBox">
<h2>Secure Login</h2>
<input id="user" type="text" placeholder="Username" style="width:90%;padding:8px;"><br><br>
<input id="pass" type="password" placeholder="Password" style="width:90%;padding:8px;"><br><br>
<button onclick="doLogin()">Login</button>
</div>

<div id="main" style="display:none;">
<h1>Golf PGA Champion and Korn Ferry Score Comparator</h1>

<div class="wrap">
<button onclick="clearOfficial()" class="clearBtn">Clear Official</button>
<button onclick="clearBoth()" class="clearBothBtn">Clear Both</button>
<button onclick="clearRS3()" class="clearBtn">Clear RS3</button>

<div class="flex">
<textarea id="official" placeholder="Paste OFFICIAL Excel (TAB separated)"></textarea>
<textarea id="rs3" placeholder="Paste RS3 Excel (TAB separated)"></textarea>
</div>

<button onclick="compare()">COMPARE</button> <button onclick="openPlayerMapping()">🗺 PLAYER MAPPING</button> <button onclick="manageMappings()">⚙ MANAGE MAPPINGS</button>
<div id="output"></div>
</div>
</div>

<script>
/* ================= FIREBASE INITIALIZATION ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBGyylXEUMC7bOHpHu0mMjBxGdehk6OT1E",
  authDomain: "sports-tools-fc26c.firebaseapp.com",
  projectId: "sports-tools-fc26c",
  storageBucket: "sports-tools-fc26c.firebasestorage.app",
  messagingSenderId: "730294504124",
  appId: "1:730294504124:web:67aec0314f9627db745eb9"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

let firebaseMappings = {};

/* ================= LOGIN ================= */
async function doLogin(){
    if(user.value==="OSED" && pass.value==="OSED@1234"){
        localStorage.setItem("golfAuth","1");
        loginBox.style.display="none";
        main.style.display="block";
        logoutBtn.style.display="block";
        await loadMappings();
    } else alert("Invalid login!");
}
function logout(){localStorage.removeItem("golfAuth");location.reload();}
window.onload = async () => {
    if(localStorage.getItem("golfAuth")==="1"){
        loginBox.style.display="none";
        main.style.display="block";
        logoutBtn.style.display="block";
        await loadMappings();
    }
};

/* ================= CLEAR ================= */
function clearOfficial(){official.value="";}
function clearRS3(){rs3.value="";}
function clearBoth(){clearOfficial();clearRS3();output.innerHTML="";}

/* ================= HELPERS ================= */
function splitRowStrict(line,label){
    if(!line.includes("\t")){
        alert(label+" data must be pasted directly from Excel (TAB separated).");
        throw "Invalid "+label+" format";
    }
    return line.split("\t");
}

function cellToHole(v){
    if(v==null) return null;
    v=String(v).trim();
    if(!/^\d+$/.test(v)) return null;
    let n=Number(v);
    return (n>=2 && n<=9)?n:null;
}

/* ================= NAME NORMALIZATION ================= */
function normalizeNameKey(name){
    if(!name) return "";
    let s=name.normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .replace(/[().]/g,"")
        .replace(/[^a-z\s]/g," ")
        .replace(/\s+/g," ")
        .trim();

    let parts=s.split(" ");
    const suffixes=["jr","sr","ii","iii","iv"];
    while(parts.length && suffixes.includes(parts[parts.length-1])) parts.pop();
    if(parts.length<2) return "";

    const last=parts[parts.length-1];
    const firsts=parts.slice(0,parts.length-1);
    const initials=firsts.map(p=>p[0]).join("");

    return last+"_"+initials;
}

/* ================= NAME MATCH LOGIC ================= */
/*
Rules:
1. Last name must match
2. Initials must be equal OR one must be prefix of the other
   J  ↔ JJ
   A  ↔ AJ
   SW ↔ SWO
*/
function nameKeyMatch(k1,k2){
    if(!k1 || !k2) return false;

    const [last1, ini1] = k1.split("_");
    const [last2, ini2] = k2.split("_");

    if(last1 !== last2) return false;
    if(ini1 === ini2) return true;
    if(ini1.startsWith(ini2) || ini2.startsWith(ini1)) return true;
    return false;
}

/* ================= RS3 PARSER ================= */
/*
RS3:
A Pos
B Name
I..Z → H1..H18
*/
function parseRS3(text){
    const lines=text.split(/\n/).map(l=>l.replace(/\u200B/g,"")).filter(l=>l.trim());
    const players={};

    for(const line of lines){
        const c=splitRowStrict(line,"RS3");
        if(!/^\d+$/.test(c[0])) continue;
        const name=c[1]?.trim();
        if(!name) continue;

        const holes=c.slice(8,26).map(cellToHole);
        while(holes.length<18) holes.push(null);

        players[name]={name,holes,key:normalizeNameKey(name)};
    }
    return players;
}

/* ================= OFFICIAL PARSER ================= */
/*
Official:
Row1: Pos, blank, Total, H1..H9, Out, H10..H18, In, Tot, R2
Row2: Player name
*/
function parseOfficial(text){
    const lines=text.split(/\n/).map(l=>l.replace(/\u200B/g,"")).filter(l=>l.trim());
    const players={};

    for(let i=0;i<lines.length-1;i++){
        const c=splitRowStrict(lines[i],"OFFICIAL");
        if(!/^(T?\d+|-|\d+|E)$/.test(c[0]?.trim())) continue;

        let holes=[];
        for(let x=3;x<=11;x++) holes.push(cellToHole(c[x]));   // D..L
        for(let x=13;x<=21;x++) holes.push(cellToHole(c[x]));  // N..V

        while(holes.length<18) holes.push(null);

        const name=lines[i+1].trim();
        players[name]={name,holes,key:normalizeNameKey(name)};
        i++;
    }
    return players;
}


let lastOFF=null,lastRS3=null;

/* ================= FIRESTORE MAPPING IMPLEMENTATION ================= */
async function loadMappings(){
    try {
        const snapshot = await db.collection("playerMappings").get();
        firebaseMappings = {};
        snapshot.forEach(doc => {
            const data = doc.data();
            if(data.officialName && data.rs3Name){
                firebaseMappings[data.officialName] = data.rs3Name;
            }
        });
    } catch(e) {
        console.error("Error loading mappings from Firestore:", e);
    }
}

function getMappings(){
    return firebaseMappings;
}

function openPlayerMapping(){
 if(!lastOFF||!lastRS3){ alert("Run Compare first"); return; }

 const mappings=getMappings();
 const used=new Set();
 const off=[];
 const rs3=[];

 for(const o in lastOFF){
   let found=false;

   const mapped=mappings[lastOFF[o].key];
   if(mapped && lastRS3[mapped]){
      used.add(mapped);
      found=true;
   }else{
      for(const r in lastRS3){
        if(used.has(r)) continue;
        if(nameKeyMatch(lastOFF[o].key,lastRS3[r].key)){
           used.add(r);
           found=true;
           break;
        }
      }
   }

   if(!found) off.push(o);
 }

 for(const r in lastRS3){
   if(!used.has(r)) rs3.push(r);
 }

 let rows="";
 off.forEach(o=>{
   rows+=`<tr><td>${o}</td><td><select data-official="${o}" data-key="${lastOFF[o].key}">
   <option value="">Select RS3 Player</option>
   ${rs3.map(x=>`<option value="${x}">${x}</option>`).join("")}
   </select></td></tr>`;
 });

 document.body.insertAdjacentHTML('beforeend',`
 <div id="mapPopup" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;">
 <div style="background:#fff;width:900px;margin:40px auto;padding:20px;max-height:80%;overflow:auto;">
 <h2>Player Mapping</h2>
 <table width="100%"><tr><th>Official</th><th>RS3</th></tr>${rows}</table><br>
 <button onclick="saveMappings()">Save</button>
 <button onclick="document.getElementById('mapPopup').remove()">Close</button>
 </div></div>`);
}

async function saveMappings(){
 const selects = document.querySelectorAll('#mapPopup select');
 for(const s of selects){
    if(s.value){
       const officialKey = s.dataset.key;
       const rs3Name = s.value;
       firebaseMappings[officialKey] = rs3Name;
       try {
           await db.collection("playerMappings").doc(officialKey).set({
               officialName: officialKey,
               rs3Name: rs3Name
           });
       } catch(e) {
           console.error("Error saving mapping to Firestore:", e);
       }
    }
 }
 const popup = document.getElementById('mapPopup');
 if(popup) popup.remove();
 compare();
}

async function manageMappings(){
 await loadMappings();
 const m=getMappings();
 let rows='';
 Object.keys(m).forEach(k=>{
   rows+=`<tr><td>${k}</td><td><input data-key="${k}" value="${m[k]}" style="width:95%"></td>
   <td><button onclick="deleteMapping('${k}')">Delete</button></td></tr>`;
 });

 document.body.insertAdjacentHTML('beforeend',`
 <div id="managePopup" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;">
 <div style="background:#fff;width:1000px;margin:40px auto;padding:20px;max-height:80%;overflow:auto;">
 <h2>Manage Mappings</h2>
 <p>Saved Mappings: ${Object.keys(m).length}</p>
 <table width="100%"><tr><th>Official Key</th><th>RS3 Player</th><th>Action</th></tr>${rows}</table><br>
 <button onclick="saveManagedMappings()">Save Changes</button>
 <button onclick="document.getElementById('managePopup').remove()">Close</button>
 </div></div>`);
}

async function saveManagedMappings(){
 const inputs = document.querySelectorAll('#managePopup input');
 for(const i of inputs){
   const key = i.dataset.key;
   const val = i.value.trim();
   if(val){
       firebaseMappings[key] = val;
       try {
           await db.collection("playerMappings").doc(key).set({
               officialName: key,
               rs3Name: val
           });
       } catch(e) {
           console.error("Error saving managed mapping:", e);
       }
   }
 }
 const popup = document.getElementById('managePopup');
 if(popup) popup.remove();
 if(lastOFF && lastRS3) compare();
}

async function deleteMapping(k){
 try {
     await db.collection("playerMappings").doc(k).delete();
     delete firebaseMappings[k];
 } catch(e) {
     console.error("Error deleting mapping from Firestore:", e);
 }
 const popup = document.getElementById('managePopup');
 if(popup) popup.remove();
 manageMappings();
}

/* ================= COMPARE ================= */
function compare(){
    let OFF,RS3;
    try{
        OFF=parseOfficial(official.value);
        RS3=parseRS3(rs3.value);
        lastOFF=OFF; lastRS3=RS3;
    }catch(e){return;}

    let html=`<table><tr><th>Player</th>`;
    for(let i=1;i<=18;i++) html+=`<th>H${i}</th>`;
    html+=`<th>Status</th></tr>`;

    const usedRS3=new Set();

    for(const o in OFF){
        let match=null;
        const mappings=getMappings();
        const mapped=mappings[OFF[o].key];
        if(mapped && RS3[mapped]){
            match=mapped;
            usedRS3.add(mapped);
        }
        if(!match) for(const r in RS3){
            if(usedRS3.has(r)) continue;
            if(nameKeyMatch(OFF[o].key,RS3[r].key)){
                match=r;
                usedRS3.add(r);
                break;
            }
        }

        const O=OFF[o];
        const R=match?RS3[match]:null;
        let status="MATCH";

        let row=`<tr><td class="playerCell">${o}<br>
        <span class="subName">⇔ ${match||"NO MATCH"}</span></td>`;

        for (let h = 0; h < 18; h++) {
    const a = O.holes[h];            // OFFICIAL
    const b = R ? R.holes[h] : null; // RS3
    let cls = "ok";

    // OFFICIAL has value, RS3 missing → NEED TO UPDATE
    if (a != null && b == null) {
        cls = "upd";
        status = "NEED TO UPDATE";
    }
    // OFFICIAL missing, RS3 has value → MISMATCH
    else if (a == null && b != null) {
        cls = "mis";
        status = "MISMATCH";
    }
    // Both present but different → MISMATCH
    else if (a != null && b != null && a !== b) {
        cls = "mis";
        status = "MISMATCH";
    }

    row += `<td class="${cls}">${a ?? "-"}|${b ?? "-"}</td>`;
}

        row+=`<td class="${status==="MATCH"?"ok":status==="NEED TO UPDATE"?"upd":"mis"}">${status}</td></tr>`;
        html+=row;
    }

    html+="</table>";
    output.innerHTML=html;
}
</script>
</body>
</html>
